<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - Weda Quest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-parchment">
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="brand-logo"><i class="fa-solid fa-om logo-icon"></i><div class="brand-text"><span class="title">WEDA QUEST</span><span class="subtitle">DARSANA EDITION</span></div></a>
            <nav class="nav-menu">
                <a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i> Beranda</a>
                <a href="peta-quest.html" class="nav-link"><i class="fa-solid fa-map-location-dot"></i> Peta Quest</a>
                <a href="materi.html" class="nav-link"><i class="fa-solid fa-book-open"></i> Materi</a>
                <a href="flashcard.html" class="nav-link"><i class="fa-solid fa-clone"></i> Flashcard</a>
                <a href="tantangan.html" class="nav-link"><i class="fa-solid fa-scroll"></i> Tantangan</a>
                <a href="profil.html" class="nav-link active"><i class="fa-solid fa-user-shield"></i> Profil</a>
            </nav>
        </div>
    </header>

    <main class="dashboard-section">
        <h2><i class="fa-solid fa-user-shield"></i> Profil PenjelajahKebijaksanaan</h2>
        <div class="dash-card" style="margin-top: 1.5rem;">
            <form id="profileForm" onsubmit="saveProfile(event)">
                <div style="margin-bottom: 1rem;">
                    <label style="font-weight: 700;">Nama Lengkap:</label>
                    <input type="text" id="profName" style="width:100%; padding: 10px; border-radius:6px; border:1px solid #CBD5E1;" required>
                </div>
                <div style="margin-bottom: 1rem;">
                    <label style="font-weight: 700;">Sekolah / Kelas:</label>
                    <input type="text" id="profSchool" style="width:100%; padding: 10px; border-radius:6px; border:1px solid #CBD5E1;" required>
                </div>
                <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Simpan Profil</button>
            </form>
        </div>
    </main>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('profName').value = appState.userProfile.name;
            document.getElementById('profSchool').value = appState.userProfile.school;
        });

        function saveProfile(e) {
            e.preventDefault();
            appState.userProfile.name = document.getElementById('profName').value;
            appState.userProfile.school = document.getElementById('profSchool').value;
            saveAppState();
            alert("✅ Profil berhasil diperbarui!");
        }
    </script>
</body>
</html>
