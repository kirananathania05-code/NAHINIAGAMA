<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materi Pembelajaran - Weda Quest: Darsana Edition</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        .materi-container {
            max-width: 1280px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 2rem;
        }

        .materi-sidebar {
            background: #FFFFFF;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-gold);
            padding: 1.5rem;
            box-shadow: var(--shadow-soft);
            position: sticky;
            top: 90px;
            height: fit-content;
            max-height: calc(100vh - 120px);
            overflow-y: auto;
        }

        .sidebar-title {
            font-size: 1.1rem;
            color: var(--secondary-dark);
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--primary-gold);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .materi-menu-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .materi-menu-btn {
            width: 100%;
            text-align: left;
            padding: 12px 14px;
            border: 1px solid #E2E8F0;
            background: #F8FAFC;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .materi-menu-btn:hover {
            background: rgba(212, 175, 55, 0.15);
            border-color: var(--primary-gold);
            color: var(--secondary-dark);
        }

        .materi-menu-btn.active {
            background: var(--secondary-dark);
            color: var(--primary-gold);
            border-color: var(--primary-gold);
            box-shadow: 0 4px 12px rgba(13, 27, 42, 0.2);
        }

        .materi-content-card {
            background: #FFFFFF;
            border-radius: var(--radius-md);
            border: 1px solid #E2E8F0;
            padding: 2.5rem;
            box-shadow: var(--shadow-soft);
            min-height: 500px;
        }

        .quick-1min-box {
            background: linear-gradient(135deg, #FFF2B2 0%, #FFE57F 100%);
            border-left: 5px solid var(--primary-gold);
            padding: 1.2rem;
            border-radius: var(--radius-md);
            margin-bottom: 2rem;
            color: #5C4033;
        }

        .quick-1min-box h4 {
            color: #8B4513;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .subtopic-block {
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px dashed #E2E8F0;
        }

        .subtopic-block h3 {
            color: var(--secondary-dark);
            margin-bottom: 0.8rem;
            font-size: 1.25rem;
        }

        .subtopic-block p, .subtopic-block ul, .subtopic-block ol {
            line-height: 1.8;
            color: #334155;
            font-size: 1rem;
        }

        .subtopic-block ul, .subtopic-block ol {
            margin-left: 1.5rem;
            margin-top: 0.5rem;
        }

        .materi-footer-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 2px solid var(--border-gold);
        }

        @media (max-width: 900px) {
            .materi-container {
                grid-template-columns: 1fr;
            }
            .materi-sidebar {
                position: static;
                max-height: none;
            }
        }
    </style>
</head>
<body class="bg-parchment">

    <!-- Header Navbar -->
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="brand-logo">
                <i class="fa-solid fa-om logo-icon"></i>
                <div class="brand-text">
                    <span class="title">WEDA QUEST</span>
                    <span class="subtitle">DARSANA EDITION</span>
                </div>
            </a>
            <nav class="nav-menu" id="navMenu">
                <a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i> Beranda</a>
                <a href="peta-quest.html" class="nav-link"><i class="fa-solid fa-map-location-dot"></i> Peta Quest</a>
                <a href="materi.html" class="nav-link active"><i class="fa-solid fa-book-open"></i> Materi</a>
                <a href="flashcard.html" class="nav-link"><i class="fa-solid fa-clone"></i> Flashcard</a>
                <a href="tantangan.html" class="nav-link"><i class="fa-solid fa-scroll"></i> Tantangan</a>
                <a href="profil.html" class="nav-link"><i class="fa-solid fa-user-shield"></i> Profil</a>
            </nav>
            <button class="mobile-toggle" id="mobileToggle">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="materi-container">
        <!-- Sidebar Navigasi Semua Aliran Darsana -->
        <aside class="materi-sidebar">
            <h3 class="sidebar-title"><i class="fa-solid fa-list-check"></i> Daftar Aliran Darsana</h3>
            <div class="materi-menu-list" id="materiMenuList">
                <!-- Otomatis di-render via JavaScript -->
            </div>
        </aside>

        <!-- Area Tampilan Detail Materi -->
        <section class="materi-content-card" id="materiContentDisplay">
            <!-- Isinya diisi dinamis oleh materi.js -->
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-container">
            <p>&copy; 2026 <strong>Weda Quest: Darsana Edition</strong>. Pendidikan Agama Hindu SMA Class XI.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/materi.js"></script>
</body>
</html>
