<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tantangan - Weda Quest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .quiz-container { max-width: 800px; margin: 2rem auto; background: #FFF; border-radius: var(--radius-md); border: 1px solid var(--border-gold); padding: 2rem; box-shadow: var(--shadow-soft); }
        .option-btn { width: 100%; text-align: left; padding: 1rem; margin-bottom: 10px; border: 1px solid #CBD5E1; border-radius: 8px; background: #FFF; cursor: pointer; font-size: 1rem; transition: all 0.2s; }
        .option-btn:hover { background: #FFF2B2; border-color: var(--primary-gold); }
        .option-btn.correct { background: #D1FAE5; border-color: #10B981; }
        .option-btn.wrong { background: #FEE2E2; border-color: #EF4444; }
    </style>
</head>
<body class="bg-parchment">
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="brand-logo"><i class="fa-solid fa-om logo-icon"></i><div class="brand-text"><span class="title">WEDA QUEST</span><span class="subtitle">DARSANA EDITION</span></div></a>
            <nav class="nav-menu">
                <a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i> Beranda</a>
                <a href="peta-quest.html" class="nav-link"><i class="fa-solid fa-map-location-dot"></i> Peta Quest</a>
                <a href="materi.html" class="nav-link"><i class="fa-solid fa-book-open"></i> Materi</a>
                <a href="flashcard.html" class="nav-link"><i class="fa-solid fa-clone"></i> Flashcard</a>
                <a href="tantangan.html" class="nav-link active"><i class="fa-solid fa-scroll"></i> Tantangan</a>
                <a href="profil.html" class="nav-link"><i class="fa-solid fa-user-shield"></i> Profil</a>
            </nav>
        </div>
    </header>

    <main class="quiz-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h2><i class="fa-solid fa-fire"></i> Try Out Sad Darsana</h2>
            <span id="quizProgress" style="font-weight: 700; color: var(--primary-saffron);">Soal 1 / 25</span>
        </div>

        <h3 id="quizQuestion" style="margin-bottom: 1.5rem; line-height: 1.5;">Pertanyaan...</h3>
        <div id="quizOptions"></div>
        
        <div id="quizExplanation" style="display: none; margin-top: 1.5rem; padding: 1rem; background: #F8FAFC; border-left: 4px solid var(--accent-cyan); border-radius: 6px;"></div>

        <div style="margin-top: 2rem; text-align: right;">
            <button id="nextBtn" class="btn btn-primary" onclick="nextQuestion()" style="display: none;">Soal Berikutnya <i class="fa-solid fa-arrow-right"></i></button>
        </div>
    </main>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script>
        let qIndex = 0;
        let score = 0;
        const questions = DARSANA_DATA.quizBank.slice(0, 25);

        function renderQuestion() {
            const q = questions[qIndex];
            document.getElementById('quizProgress').textContent = `Soal ${qIndex + 1} / ${questions.length}`;
            document.getElementById('quizQuestion').textContent = q.question;
            document.getElementById('quizExplanation').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';

            const opts = document.getElementById('quizOptions');
            opts.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(idx, q.answer, q.explanation);
                opts.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct, exp) {
            const btns = document.querySelectorAll('.option-btn');
            btns.forEach((btn, i) => {
                btn.disabled = true;
                if(i === correct) btn.classList.add('correct');
                if(i === selected && selected !== correct) btn.classList.add('wrong');
            });
            if(selected === correct) score += 4;
            
            const expBox = document.getElementById('quizExplanation');
            expBox.innerHTML = `<strong><i class="fa-solid fa-circle-info"></i> Pembahasan:</strong> ${exp}`;
            expBox.style.display = 'block';
            document.getElementById('nextBtn').style.display = 'inline-flex';
        }

        function nextQuestion() {
            qIndex++;
            if(qIndex < questions.length) {
                renderQuestion();
            } else {
                addXP(score * 2);
                appState.quizHistory.tryoutScore = score;
                saveAppState();
                alert(`🏁 Try Out Selesai!\nNilai Akhir Anda: ${score}/100\nAnda mendapatkan +${score*2} XP!`);
                window.location.href = 'sertifikat.html';
            }
        }

        document.addEventListener('DOMContentLoaded', renderQuestion);
    </script>
</body>
</html>
